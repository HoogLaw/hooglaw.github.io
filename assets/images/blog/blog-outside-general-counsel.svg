<svg xmlns="http://www.w3.org/2000/svg" width="660" height="346" viewBox="0 0 660 346">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4f6f8"/>
    <stop offset="0.55" stop-color="#eceff2"/>
    <stop offset="1" stop-color="#e2e6ea"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f2f0eb"/>
  </linearGradient>
  <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#23282e"/>
    <stop offset="0.5" stop-color="#14181d"/>
    <stop offset="1" stop-color="#0c0f12"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e0c26a"/>
    <stop offset="0.5" stop-color="#bf9a34"/>
    <stop offset="1" stop-color="#8f7223"/>
  </linearGradient>
  <linearGradient id="skyFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity="0"/>
    <stop offset="0.2" stop-color="#fff" stop-opacity="1"/>
    <stop offset="0.8" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
  <mask id="skyMask"><rect x="140" y="0" width="380" height="100" fill="url(#skyFade)"/></mask>
  <radialGradient id="vig" cx="0.5" cy="0.45" r="0.8">
    <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#233246" stop-opacity="0.10"/>
  </radialGradient>
  <filter id="sh" x="-30%" y="-30%" width="180%" height="180%">
    <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#2c3a4d" flood-opacity="0.20"/>
  </filter>
  <filter id="shSm" x="-40%" y="-40%" width="200%" height="200%">
    <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#2c3a4d" flood-opacity="0.24"/>
  </filter>
</defs>

<style>
  .disp  { font-family: Georgia, 'Times New Roman', serif; fill:#17304f; }
  .item  { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; fill:#2f4056; font-size:12px; }
  .ctitle{ font-family: Georgia, 'Times New Roman', serif; fill:#17304f; font-weight:bold; font-size:14px; }
  .chk   { fill:none; stroke:#20395b; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }
  .box   { fill:none; stroke:#20395b; stroke-width:1.5; }
</style>

<rect width="660" height="346" fill="url(#bg)"/>

<!-- faded skyline behind the wordmark -->
<g mask="url(#skyMask)" opacity="0.42">
  <g fill="#8fa2b6">
    <rect x="152" y="64" width="15" height="32"/>
    <rect x="170" y="46" width="12" height="50"/>
    <rect x="185" y="70" width="16" height="26"/>
    <rect x="204" y="32" width="14" height="64"/>
    <rect x="221" y="56" width="11" height="40"/>
    <rect x="235" y="20" width="16" height="76"/>
    <rect x="254" y="44" width="12" height="52"/>
    <rect x="269" y="14" width="15" height="82"/>
    <rect x="287" y="40" width="11" height="56"/>
    <rect x="301" y="58" width="15" height="38"/>
    <rect x="319" y="26" width="12" height="70"/>
    <rect x="334" y="62" width="16" height="34"/>
    <rect x="353" y="42" width="12" height="54"/>
    <rect x="368" y="68" width="15" height="28"/>
    <rect x="386" y="50" width="11" height="46"/>
    <rect x="400" y="60" width="15" height="36"/>
    <rect x="418" y="36" width="12" height="60"/>
    <rect x="433" y="66" width="16" height="30"/>
    <rect x="452" y="52" width="11" height="44"/>
    <rect x="466" y="70" width="15" height="26"/>
    <rect x="484" y="48" width="12" height="48"/>
  </g>
  <path d="M 269 14 L 276 2 L 284 14 Z" fill="#8fa2b6"/>
</g>

<!-- scales of justice, left -->
<g transform="translate(-425.9,-16.3) scale(0.643)" filter="url(#shSm)">
  <ellipse cx="748" cy="147" rx="27" ry="6.5" fill="url(#gold)"/>
  <ellipse cx="748" cy="143.5" rx="20" ry="4.5" fill="#d9b95c"/>
  <path d="M 741 143 L 745 66 L 751 66 L 755 143 Z" fill="url(#gold)"/>
  <circle cx="748" cy="60" r="5.5" fill="#d9b95c" stroke="#8f7223" stroke-width="0.8"/>
  <rect x="694" y="63" width="108" height="4" rx="2" fill="url(#gold)"/>
  <circle cx="694" cy="65" r="3" fill="#8f7223"/>
  <circle cx="802" cy="65" r="3" fill="#8f7223"/>
  <g stroke="#a8862b" stroke-width="1.4" fill="none">
    <path d="M 694 67 L 682 84 M 694 67 L 706 84 M 694 67 L 694 84"/>
    <path d="M 802 67 L 790 84 M 802 67 L 814 84 M 802 67 L 802 84"/>
  </g>
  <path d="M 680 84 Q 694 101 708 84 Z" fill="url(#gold)"/>
  <path d="M 788 84 Q 802 101 816 84 Z" fill="url(#gold)"/>
  <rect x="678" y="82" width="32" height="3" rx="1.5" fill="#d9b95c"/>
  <rect x="786" y="82" width="32" height="3" rx="1.5" fill="#d9b95c"/>
</g>

<!-- leather briefcase, right -->
<g transform="translate(105.4,7.7) scale(0.536)" filter="url(#sh)">
  <path d="M 908 32 Q 908 8 932 8 Q 956 8 956 32" fill="none" stroke="#1b1f24" stroke-width="8" stroke-linecap="round"/>
  <rect x="848" y="30" width="168" height="122" rx="11" fill="url(#leather)"/>
  <rect x="848" y="30" width="168" height="30" rx="11" fill="#282e35"/>
  <rect x="848" y="56" width="168" height="4" fill="#0a0d10"/>
  <rect x="916" y="46" width="32" height="28" rx="4" fill="url(#gold)"/>
  <rect x="922" y="52" width="20" height="16" rx="2.5" fill="#8f7223"/>
  <rect x="866" y="94" width="20" height="13" rx="2" fill="#b8942f" opacity="0.9"/>
  <rect x="978" y="94" width="20" height="13" rx="2" fill="#b8942f" opacity="0.9"/>
</g>

<!-- torn paper wordmark -->
<g filter="url(#sh)">
  <path d="M 112 14 L 166 9 L 220 14 L 274 8 L 328 14 L 382 9 L 436 14 L 490 9 L 548 14
           L 546 92 L 490 97 L 436 91 L 382 97 L 328 91 L 274 97 L 220 91 L 166 97 L 113 92 Z"
        fill="url(#paper)"/>
  <path d="M 112 14 L 166 9 L 220 14 L 274 8 L 328 14 L 382 9 L 436 14 L 490 9 L 548 14"
        fill="none" stroke="#dedad1" stroke-width="1.2"/>
  <path d="M 113 92 L 166 97 L 220 91 L 274 97 L 328 91 L 382 97 L 436 91 L 490 97 L 546 92"
        fill="none" stroke="#dedad1" stroke-width="1.2"/>
</g>
<text class="disp" x="330" y="38" text-anchor="middle" font-size="14" letter-spacing="5" textLength="120" lengthAdjust="spacingAndGlyphs" fill="#2a4364">OUTSIDE</text>
<text class="disp" x="330" y="70" text-anchor="middle" font-size="30" font-weight="bold" textLength="330" lengthAdjust="spacingAndGlyphs" fill="#132c4b">GENERAL COUNSEL</text>
<text class="disp" x="330" y="86" text-anchor="middle" font-size="9.5" letter-spacing="3.2" textLength="210" lengthAdjust="spacingAndGlyphs" fill="#2a4364">TRUSTED LEGAL PARTNER</text>

<!-- card 1 : legal strategy -->
<g filter="url(#sh)">
  <rect x="8" y="104" width="155" height="232" rx="3" fill="url(#paper)"/>
  <g transform="translate(85.5 133)">
    <circle r="19" fill="#16273d" stroke="url(#gold)" stroke-width="2.4"/>
    <g fill="#e0c26a" transform="scale(0.633)">
      <rect x="-13" y="-16" width="26" height="32" rx="3"/>
      <rect x="-5" y="-20" width="10" height="7" rx="2"/>
      <g stroke="#16273d" stroke-width="2.4" stroke-linecap="round">
        <path d="M -7 -6 L 7 -6"/><path d="M -7 0 L 7 0"/><path d="M -7 6 L 2 6"/>
      </g>
    </g>
  </g>
  <text class="ctitle" x="85.5" y="173" text-anchor="middle" textLength="128" lengthAdjust="spacingAndGlyphs">LEGAL STRATEGY</text>
  <g transform="translate(30 205)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="42" y="209">Risk Management</text>
  <g transform="translate(30 237)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="42" y="241">Business Guidance</text>
  <g transform="translate(30 269)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="42" y="273">Compliance</text>
  <g transform="translate(30 301)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="42" y="305">Growth Support</text>
</g>

<!-- card 2 : compliance -->
<g filter="url(#sh)">
  <rect x="171" y="104" width="155" height="232" rx="3" fill="url(#paper)"/>
  <g transform="translate(248.5 133)">
    <circle r="19" fill="#16273d" stroke="url(#gold)" stroke-width="2.4"/>
    <g fill="#e0c26a" transform="scale(0.633)">
      <path d="M 0 -19 L 15 -12.5 V 1 C 15 10 7.5 16 0 19 C -7.5 16 -15 10 -15 1 V -12.5 Z"/>
      <path d="M -6.2 0.5 L -1.9 5.4 L 6.8 -4.8" fill="none" stroke="#16273d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text class="ctitle" x="248.5" y="173" text-anchor="middle" letter-spacing="0.6">COMPLIANCE</text>
  <g transform="translate(193 205)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="205" y="209">Policies</text>
  <g transform="translate(193 237)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="205" y="241">Regulations</text>
  <g transform="translate(193 269)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="205" y="273">Training</text>
  <g transform="translate(193 301)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="205" y="305">Audits</text>
</g>

<!-- card 3 : corporate governance -->
<g filter="url(#sh)">
  <rect x="334" y="104" width="155" height="232" rx="3" fill="url(#paper)"/>
  <g transform="translate(411.5 133)">
    <circle r="19" fill="#16273d" stroke="url(#gold)" stroke-width="2.4"/>
    <g fill="#e0c26a" transform="scale(0.633) translate(0 1)">
      <circle cx="-12" cy="-6" r="4.4"/>
      <path d="M -19.5 8 C -19.5 1.5 -15.8 -0.8 -12 -0.8 C -8.2 -0.8 -4.5 1.5 -4.5 8 Z"/>
      <circle cx="12" cy="-6" r="4.4"/>
      <path d="M 4.5 8 C 4.5 1.5 8.2 -0.8 12 -0.8 C 15.8 -0.8 19.5 1.5 19.5 8 Z"/>
      <circle cx="0" cy="-9" r="5.8"/>
      <path d="M -9 10 C -9 2.5 -4.7 -0.8 0 -0.8 C 4.7 -0.8 9 2.5 9 10 Z"/>
    </g>
  </g>
  <text class="ctitle" x="411.5" y="167" text-anchor="middle" letter-spacing="0.6">CORPORATE</text>
  <text class="ctitle" x="411.5" y="185" text-anchor="middle" letter-spacing="0.6">GOVERNANCE</text>
  <g transform="translate(356 209)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="368" y="213">Formation</text>
  <g transform="translate(356 240)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="368" y="244">Board Governance</text>
  <g transform="translate(356 271)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="368" y="275">Bylaws &amp; Policies</text>
  <g transform="translate(356 302)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="368" y="306">Exit Strategies</text>
</g>

<!-- card 4 : contracts -->
<g filter="url(#sh)">
  <rect x="497" y="104" width="155" height="232" rx="3" fill="url(#paper)"/>
  <g transform="translate(574.5 133)">
    <circle r="19" fill="#16273d" stroke="url(#gold)" stroke-width="2.4"/>
    <g transform="scale(0.633) rotate(-7)" fill="#e0c26a">
      <rect x="-24" y="-4.6" width="21" height="9.2" rx="4.6"/>
      <rect x="3" y="-4.6" width="21" height="9.2" rx="4.6"/>
      <g transform="rotate(-15)">
        <rect x="-8" y="-11" width="9.5" height="7" rx="3.5"/>
        <rect x="-10.5" y="-8" width="21" height="16" rx="6.5"/>
        <g stroke="#16273d" stroke-width="1.8" stroke-linecap="round">
          <path d="M -6.5 -3.4 L 6 -3.4"/>
          <path d="M -7 1 L 6.5 1"/>
          <path d="M -6 5.4 L 5.5 5.4"/>
        </g>
      </g>
    </g>
  </g>
  <text class="ctitle" x="574.5" y="173" text-anchor="middle" letter-spacing="0.6">CONTRACTS</text>
  <g transform="translate(519 205)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="531" y="209">Review</text>
  <g transform="translate(519 237)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="531" y="241">Negotiate</text>
  <g transform="translate(519 269)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="531" y="273">Draft</text>
  <g transform="translate(519 301)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2.5" class="box"/><path class="chk" d="M -3.6 0 L -0.8 3.1 L 4.1 -3.6"/></g>
  <text class="item" x="531" y="305">Advise</text>
</g>

<rect width="660" height="346" fill="url(#vig)"/>
</svg>
